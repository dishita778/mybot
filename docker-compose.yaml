services:
  backend:
    build: .
    container_name: chatbot_backend
    ports:
      - "5000:5000"
    depends_on:
      - mysql
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: Topperguddan@26
      MYSQL_DATABASE: chatbot
    restart: always

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: Topperguddan@26
      MYSQL_DATABASE: chatbot
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
